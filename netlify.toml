# Netlify: build the site, and ship the one-file offline app next to it (Kiln.html)
[build]
  command = "npm run build && cp dist-single/Kiln.html dist/Kiln.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/Kiln.html"
  [headers.values]
    Content-Disposition = "attachment; filename=\"Kiln.html\""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
